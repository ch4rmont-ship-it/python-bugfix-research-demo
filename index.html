<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b111b">
  <meta name="description" content="Python Debug Lab — interactive Python debugging learning platform with real execution, hints and progress tracking.">
  <title>Python Debug Lab — Developer Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="./logo-icon.webp">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark"><span class="brand-brackets">⌘</span></div>
        <div><strong>debug<span class="brand-accent">lab</span></strong><small>DEV WORKSPACE</small></div>
      </div>
      <div class="nav-heading"><span class="explorer-mark">⌄</span> EXPLORER</div><div class="sidebar-tree-title"><span class="tree-chevron">⌄</span> PYTHON-DEBUG-LAB</div>
      <nav class="side-nav" id="nav">
        <button data-page="dashboard" class="nav-item active"><span class="nav-icon">◫</span> Overview</button>
        <button data-page="practice" class="nav-item"><span class="nav-icon">⌘</span> Debug playground <span class="nav-count">25</span></button>
        <button data-page="debugger" class="nav-item"><span class="nav-icon">⚗</span> Python Compiler</button>
        <button data-page="analytics" class="nav-item"><span class="nav-icon">▥</span> Analytics</button>
        <button data-page="guide" class="nav-item"><span class="nav-icon">▤</span> Getting started</button>
      </nav>
      <div class="side-bottom">
        <div class="side-tip"><span class="tip-icon">✦</span><strong>AI &amp; Innovative Design</strong><p>Interactive Python bug-fixing · USTB course demo</p></div>
        <div class="side-footer"><span class="live-dot"></span> No API key required <span class="side-version">v2.0</span></div>
      </div>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <button class="mobile-menu" data-action="menu" aria-label="Toggle menu">☰</button>
        <div class="window-controls" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="breadcrumbs"><span class="project-icon">⌁</span><span>python-debug-lab</span><span class="crumb-separator">/</span><strong id="page-crumb">Overview</strong></div>
        <div class="header-actions">
          <label class="language-picker" for="language-select"><span aria-hidden="true">◎</span><span class="language-label">Language</span><select id="language-select" aria-label="Website language"><option value="en">English</option><option value="zh">中文</option><option value="mn">Монгол</option></select></label>
          <span class="env-pill"><span class="live-dot"></span> Browser Python</span>
          <button class="avatar-button" data-page="dashboard" title="Python Debug Lab" aria-label="Python Debug Lab — Home"><img src="./logo-icon.webp" width="56" height="56" alt="Python Debug Lab logo" loading="eager"></button>
        </div>
      </header>
      <nav class="workspace-tabs" aria-label="Open workspace tabs">
        <button class="workspace-tab" data-page="debugger"><span class="python-file-icon">Py</span> main.py <span class="workspace-tab-close">×</span></button>
        <button class="workspace-tab" data-page="practice"><span class="python-file-icon yellow">Py</span> challenges.py <span class="workspace-tab-close">×</span></button>
        <button class="workspace-tab" data-page="analytics"><span class="python-file-icon green">{ }</span> analytics.json</button>
      </nav>
      <main id="app" class="main" aria-live="polite"></main>
      <footer class="footer"><span class="status-left"><span class="status-branch">⑂ main</span><span class="status-ok">✓ 0</span><span>Python Debug Lab</span></span><span class="status-right"><span id="cursor-status">Ln 1, Col 1</span><span>Spaces: 4</span><span>UTF-8</span><span>Python 3</span><span class="status-live"><span class="live-dot"></span> Browser runtime</span></span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
