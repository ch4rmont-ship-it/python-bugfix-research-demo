name: Validate Python Debug Lab
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test challenge data and solutions
        run: npm test
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check tasks.js
          node --check solutions.js
          node --check python-worker.js
